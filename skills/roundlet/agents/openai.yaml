interface:
  display_name: "Roundlet"
  short_description: "Prompt-native single-repository issue orchestration"
  default_prompt: "Use $roundlet in this owner-created repository task to perform the complete root activation, remain as the sole Orchestrator, continue one logical Worker through safely reconciled physical generations until the active leaf is terminal, create fresh read-only Supervisors under the independent ten-round limit, perform repository-authorized GitHub lifecycle and final task/worktree/branch cleanup, stop on denials or ambiguous effects, and otherwise continue unattended through the pinned heartbeat until STOPPED."

policy:
  allow_implicit_invocation: false
